# Publicación en Netlify: compila la app de Angular y publica los archivos estáticos.

[build]
  command = "npm run build"
  publish = "dist/bitacora-tablero/browser"

[build.environment]
  # Angular 22 requiere Node 22.12 o posterior
  NODE_VERSION = "24"
  NG_CLI_ANALYTICS = "false"

# Aplicación de una sola página: todas las rutas (/taller-ensamblado/sesiones, etc.) las resuelve Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los archivos de la build tienen un hash en el nombre: cada versión usa nombres nuevos,
# así que el navegador puede guardarlos sin vencimiento
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
